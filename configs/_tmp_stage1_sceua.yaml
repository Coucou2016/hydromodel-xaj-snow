data:
  dataset: "caravan"
  path: null
  basin_ids: ["camels_14308990"]
  warmup_length: 365
  variables: ["precipitation", "potential_evapotranspiration", "streamflow"]
  datasource_kwargs:
    region: "US"
  train_period: ["1985-10-01", "1995-09-30"]
  test_period: ["2005-10-01", "2014-09-30"]
  output_dir: "results/multi_basin_global_then_refine_v2/camels_14308990"

model:
  name: "xaj_mz"
  params:
    source_type: "sources"
    source_book: "HF"
    kernel_size: 15
  output_variable: "qsim"

training:
  # Stage 1: global search
  algorithm: "SCE_UA"
  SCE_UA:
    rep: 800
    ngs: 15
    kstop: 40
    peps: 0.1
    pcento: 0.1
    random_seed: 1234
  # Global stage uses KGE to balance bias/var/corr
  loss: "KGE"
  save_config: true

evaluation:
  metrics: ["NSE", "KGE", "RMSE", "PBIAS"]
  save_results: true
  plot_results: false

