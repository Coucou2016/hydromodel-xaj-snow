# Real-data run: CARAVAN (US/CAMELS subset) from external folder, one basin
#
# This config points `data.path` to the directory that contains the `CARAVAN/` folder.
# In your case we created a junction:
#   ../hydrodata/Caravan/usr/local/google/home/kratzert/Data/CARAVAN  ->  Caravan-Jan25-nc
#

data:
  dataset: "caravan"
  # Use default datasets-origin from ./hydro_setting.yml.
  # (The runner script creates a junction: ./_portable_data/datasets-origin/CARAVAN -> your downloaded dataset.)
  path: null
  # CARAVAN gauge IDs include a region prefix, e.g. "camels_01013500"
  basin_ids: ["camels_01013500"]
  warmup_length: 365
  variables: ["precipitation", "potential_evapotranspiration", "streamflow"]
  # Important: this CARAVAN package stores shapefiles under shapefiles/camels/..., so we use region=US.
  datasource_kwargs:
    region: "US"

  train_period: ["1985-10-01", "1995-09-30"]
  test_period: ["2005-10-01", "2014-09-30"]

  output_dir: "results/real_caravan_camels_01013500"

model:
  name: "xaj_mz"
  params:
    source_type: "sources"
    source_book: "HF"
    kernel_size: 15
  output_variable: "qsim"

training:
  algorithm: "SCE_UA"
  SCE_UA:
    rep: 300
    ngs: 20
    kstop: 50
    peps: 0.1
    pcento: 0.1
    random_seed: 1234
  loss: "RMSE"
  save_config: true

evaluation:
  metrics: ["NSE", "KGE", "RMSE", "PBIAS"]
  save_results: true
  plot_results: true

